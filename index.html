<!doctype html>
<html lang="en" dir="ltr" data-theme="parchment">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Offline Madani Mushaf reader with verse selection" />
    <meta name="theme-color" content="#fffdf7" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%icons/icon.svg" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet" />
    <title>QuranMemoriser</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash of the wrong colors.
      try {
        const theme = localStorage.getItem("qm.theme");
        if (theme === "sepia" || theme === "night") {
          document.documentElement.dataset.theme = theme;
        }
        const colors = { parchment: "#fffdf7", sepia: "#fdf8ec", night: "#211e1b" };
        const active = document.documentElement.dataset.theme || "parchment";
        const color = colors[active] || "#fffdf7";
        document.documentElement.style.backgroundColor = color;
        document.documentElement.style.colorScheme = active === "night" ? "dark" : "light";
        const meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", color);
        document.documentElement.style.setProperty("--mushaf-user-scale", "1.7");
      } catch {
        // localStorage unavailable (e.g. privacy mode) — keep the default theme.
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
